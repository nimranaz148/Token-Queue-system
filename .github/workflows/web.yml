name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
      - "scripts/verify.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
      - "scripts/verify.sh"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh --lane web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify
        run: bash scripts/verify.sh --lane web

  audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high
