name: api-db

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-db.yml"
      - "scripts/verify.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-db.yml"
      - "scripts/verify.sh"

concurrency:
  group: api-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh --lane api-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Verify
        run: bash scripts/verify.sh --lane api-db
