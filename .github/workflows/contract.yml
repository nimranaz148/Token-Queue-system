name: contract

on:
  push:
    branches: [main]
    paths:
      - "packages/api-client/**"
      - "apps/api/**"
      - ".github/workflows/contract.yml"
      - "scripts/verify.sh"
  pull_request:
    branches: [main]
    paths:
      - "packages/api-client/**"
      - "apps/api/**"
      - ".github/workflows/contract.yml"
      - "scripts/verify.sh"

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh --lane contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify
        run: bash scripts/verify.sh --lane contract
